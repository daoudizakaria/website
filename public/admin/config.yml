# Decap CMS — Research articles (GitHub backend for GitHub Pages)
# Production login: deploy an OAuth proxy and set base_url + auth_endpoint below.
# Local editing: npm run cms:dev (decap-server) — no GitHub login on localhost.

# local_backend: true

backend:
  name: github
  repo: daoudizakaria/website
  branch: main
  base_url: https://decap-oauth.meriemalime.workers.dev
  auth_endpoint: auth

publish_mode: simple

media_folder: public/uploads/research
public_path: /uploads/research

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    identifier_field: slug
    summary: "{{title}} ··· {{category}} ··· {{date | date('MMMM YYYY')}}"
    sortable_fields:
      - title
      - field: date
        default_sort: desc
    editor:
      preview: true
    fields:
      - label: Title
        name: title
        widget: cms-string
      - label: URL
        name: slug
        widget: cms-string
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - "Use lowercase letters, numbers, and hyphens"
      - label: Date
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        default: "{{now}}"
      - label: Short summary
        name: summary
        widget: cms-text
      - label: Category
        name: category
        widget: select
        options:
          - { label: "Machine Learning & Data Science", value: ml }
          - { label: "Physics & Engineering", value: physics }
          - { label: "Mathematics", value: math }
      - label: Repository / resource URL
        name: repo
        widget: cms-string
        required: false
        default: ""
      - label: Featured on home page
        name: featured
        widget: boolean
        default: false
      - label: Case study
        name: body
        widget: markdown
        default: ""
      - label: Tags
        name: tags
        widget: list
        required: false
        default: []

  - name: research_articles
    label: Research Articles
    label_singular: Research Article
    folder: src/content/research/articles
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    identifier_field: slug
    summary: "{{title}} ··· {{date | date('MMMM YYYY')}} ··· {{summary | truncate(160, '…') | default('No summary yet.')}}"
    sortable_fields:
      - title
      - field: date
        default_sort: desc
      - slug
    editor:
      preview: true
    fields:
      - label: Title
        name: title
        widget: cms-string
        placeholder: Literature Review on Quantum Computing

      - label: URL
        name: slug
        widget: cms-string
        placeholder: literature-review-quantum-computing
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - "Use lowercase letters, numbers, and hyphens (e.g. literature-review-quantum-computing)"

      - label: Publish date
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        default: "{{now}}"

      - label: Short summary
        name: summary
        widget: cms-text
        placeholder: Write a short abstract shown on the Research page (1–3 sentences).

      - label: Article
        name: body
        widget: markdown
        default: ""
        buttons:
          - bold
          - italic
          - strikethrough
          - code
          - link
          - heading-one
          - heading-two
          - heading-three
          - heading-four
          - heading-five
          - heading-six
          - quote
          - bulleted-list
          - numbered-list
        editor_components:
          - image
          - code-block
          - math-display
          - math-inline
          - horizontal-rule
          - simple-table

      - label: Paper PDF
        name: resume
        widget: file
        required: false
        default: ""
        choose_url: true
        allow_multiple: false
        media_library:
          config:
            max_file_size: 20000000

      - label: Tags
        name: tags
        widget: list
        required: false
        default: []
        label_singular: tag
        hint: >-
          Optional topics for organization (e.g. astronomy, methodology).
          Not shown on the live Research cards yet.
        allow_add: true
        field:
          label: Tag
          name: tag
          widget: string
          default: ""
