# Decap CMS — Research articles (GitHub backend for GitHub Pages)
# Production login: deploy an OAuth proxy and set base_url + auth_endpoint below.
# Local editing: npm run cms:dev (decap-server) — no GitHub login on localhost.

# local_backend: true

backend:
  name: github
  repo: daoudizakaria/website
  branch: main
  base_url: https://decap-oauth.meriemalime.workers.dev
  auth_endpoint: auth

publish_mode: simple

media_folder: public/uploads/research
public_path: /uploads/research

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    identifier_field: slug
    summary: "{{title}} ··· {{category}} ··· {{date | date('MMMM YYYY')}}"
    sortable_fields:
      - title
      - field: date
        default_sort: desc
    editor:
      preview: true
    fields:
      - label: Title
        name: title
        widget: cms-string
      - label: URL
        name: slug
        widget: cms-string
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - "Use lowercase letters, numbers, and hyphens"
      - label: Date
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        default: "{{now}}"
      - label: Short summary
        name: summary
        widget: cms-text
      - label: Category
        name: category
        widget: select
        options:
          - { label: "Machine Learning & Data Science", value: ml }
          - { label: "Physics & Engineering", value: physics }
          - { label: "Mathematics & Teaching", value: math }
      - label: Repository / resource URL
        name: repo
        widget: cms-string
        required: false
        default: ""
      - label: Companion paper (PDF)
        name: paper
        widget: file
        required: false
        default: ""
        choose_url: true
      - label: Featured (home page and "Selected work")
        name: featured
        widget: boolean
        default: false
      - label: Kind of work
        name: type
        widget: select
        required: false
        options:
          - { label: "Client work", value: client }
          - { label: "Data science case study", value: case-study }
          - { label: "Notes & simulations", value: notes }
          - { label: "Open-source tool", value: tool }
          - { label: "Teaching materials", value: teaching }
      - label: Year(s) of the work
        name: year
        widget: cms-string
        required: false
        hint: 'For example "2023" or "2025–2026".'
      - label: Order on the Projects page (1 = first)
        name: rank
        widget: number
        value_type: int
        required: false
      - label: Card thumbnail (16:9)
        name: image
        widget: image
        required: false
        choose_url: true
      - label: At a glance
        name: glance
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Problem, name: problem, widget: text, required: false }
          - { label: Approach, name: approach, widget: text, required: false }
          - { label: Result, name: result, widget: text, required: false }
          - { label: Tools, name: tools, widget: string, required: false }
      - label: Headline numbers (up to four, shown in "At a glance")
        name: metrics
        widget: list
        required: false
        collapsed: true
        fields:
          - { label: Value, name: value, widget: string }
          - { label: Unit, name: unit, widget: string, required: false }
          - { label: What it measures, name: label, widget: string }
          - { label: Comparison or note, name: note, widget: string, required: false }
      - label: Old URLs that should open this project
        name: aliases
        widget: list
        required: false
        default: []
      - label: Case study
        name: body
        widget: markdown
        default: ""
      - label: Tags
        name: tags
        widget: list
        required: false
        default: []

  - name: research_articles
    label: Research Articles
    label_singular: Research Article
    folder: src/content/research/articles
    create: true
    slug: "{{fields.slug}}"
    extension: md
    format: frontmatter
    identifier_field: slug
    summary: "{{title}} ··· {{date | date('MMMM YYYY')}} ··· {{summary | truncate(160, '…') | default('No summary yet.')}}"
    sortable_fields:
      - title
      - field: date
        default_sort: desc
      - slug
    editor:
      preview: true
    fields:
      - label: Title
        name: title
        widget: cms-string
        placeholder: Literature Review on Quantum Computing

      - label: URL
        name: slug
        widget: cms-string
        placeholder: literature-review-quantum-computing
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - "Use lowercase letters, numbers, and hyphens (e.g. literature-review-quantum-computing)"

      - label: Publish date
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        default: "{{now}}"

      - label: Short summary
        name: summary
        widget: cms-text
        placeholder: Write a short abstract shown on the Research page (1–3 sentences).

      - label: Article
        name: body
        widget: markdown
        default: ""
        buttons:
          - bold
          - italic
          - strikethrough
          - code
          - link
          - heading-one
          - heading-two
          - heading-three
          - heading-four
          - heading-five
          - heading-six
          - quote
          - bulleted-list
          - numbered-list
        editor_components:
          - image
          - code-block
          - math-display
          - math-inline
          - horizontal-rule
          - simple-table

      - label: Overview (summary, key results, figure)
        name: overview
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Summary, name: summary, widget: text, required: false }
          - label: Key results (Markdown, inline $maths$ allowed)
            name: results
            widget: list
            required: false
            field: { label: Result, name: result, widget: text }
          - { label: Figure, name: figure, widget: image, required: false, choose_url: true }
          - { label: Figure caption, name: figureCaption, widget: string, required: false }
      - label: Paper PDF
        name: resume
        widget: file
        required: false
        default: ""
        choose_url: true
        allow_multiple: false
        media_library:
          config:
            max_file_size: 20000000

      - label: Tags
        name: tags
        widget: list
        required: false
        default: []
        label_singular: tag
        hint: >-
          Optional topics for organization (e.g. astronomy, methodology).
          Not shown on the live Research cards yet.
        allow_add: true
        field:
          label: Tag
          name: tag
          widget: string
          default: ""
